<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARGO board</title>
<style>
:root{--bg:#0a0f14;--panel:#0f1a22;--line:#1f3a4a;--text:#d5e6ef;--dim:#8fb2c4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,Segoe UI,sans-serif;height:100%}
#top{position:sticky;top:0;z-index:100000;display:flex;gap:8px;align-items:center;padding:8px 12px;background:#0b1117;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
#top b{letter-spacing:.15em;color:#5ab8e6;margin-right:6px}
.chip,.btn{background:#12202b;color:#bfe3f5;border:1px solid #28506a;border-radius:16px;padding:4px 12px;cursor:pointer;font:inherit}
.chip.on{background:#1d4660;border-color:#4aa3d3;color:#fff}
.btn{border-radius:8px}
#spacer{flex:1}
#msg{color:var(--dim);font-size:12px}
#canvas{position:relative;min-height:calc(100vh - 56px);margin:0;touch-action:pan-x pan-y}
.card{position:absolute;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-top-width:3px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.45);overflow:hidden}
.card header{display:flex;align-items:center;gap:6px;padding:6px 8px;cursor:grab;user-select:none;touch-action:none;background:rgba(255,255,255,.03)}
.card header:active{cursor:grabbing}
.card header b{flex:1;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card header button{background:transparent;color:var(--dim);border:0;cursor:pointer;font-size:15px;padding:0 4px}
.card .body{flex:1;overflow:auto;padding:8px 10px}
.card.collapsed .body,.card.collapsed .grip{display:none}
.card .grip{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 55%,var(--dim) 55%,var(--dim) 62%,transparent 62%,transparent 74%,var(--dim) 74%,var(--dim) 81%,transparent 81%)}
.swatches{display:none;gap:4px;padding:4px 8px;background:#0b1117;border-bottom:1px solid var(--line)}
.card.pick .swatches{display:flex}
.sw{width:18px;height:18px;border-radius:50%;border:1px solid #fff3;cursor:pointer}
.c-slate{border-top-color:#6b8ba0}.c-teal{border-top-color:#2fb3b3}.c-green{border-top-color:#3fbf7f}.c-amber{border-top-color:#e0a63a}
.c-rose{border-top-color:#e06a8a}.c-violet{border-top-color:#9a7be0}.c-blue{border-top-color:#4a9be0}.c-gray{border-top-color:#8a8f94}
.dim{color:var(--dim);font-size:12px}
.row{border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:0 0 8px;background:#0c151c}
.row .t{display:flex;gap:6px;align-items:baseline}.row .t b{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;padding:0 7px;border-radius:9px;border:1px solid}
.tag.working{color:#5fd39a;border-color:#2c6a4c}.tag.stalled{color:#f0b34a;border-color:#7a5a1c}
.tag.waiting{color:#7db8ff;border-color:#2f5d99}.tag.done{color:#5fd0d0;border-color:#2c6a6a}
.tag.failed,.tag.timed_out{color:#ff7b7b;border-color:#8a3a3a}.tag.cancelled,.tag.starting{color:#9aa7b0;border-color:#3a4650}
.tag.idea,.tag.list,.tag.decision,.tag.find{color:#bfe3f5;border-color:#28506a}
.bar{height:5px;background:#162630;border-radius:3px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:#2fa87a}
.q{margin-top:5px;color:#bcd9ff}
.prev{margin-top:5px;color:#a9c2d0;font-size:12px;white-space:pre-wrap}
.row.click{cursor:pointer}
.body img{max-width:100%;border-radius:6px;display:block;margin:0 auto}
.body iframe{width:100%;height:100%;min-height:200px;border:0;border-radius:6px;background:#fff}
.note{padding:4px 0;border-bottom:1px solid #162630}
</style>
</head>
<body>
<div id="top"><b>ARGO</b><span id="chips"></span><span id="spacer"></span><span id="msg"></span>
  <button class="btn" id="tidy" title="Put the cards back in a neat grid">Tidy up</button>
  <a class="btn" href="/v2" style="text-decoration:none" title="Voice, models and all the old controls">Settings</a></div>
<div id="canvas"></div>
<script>
(function () {
  'use strict';
  var COLORS = ['slate','teal','green','amber','rose','violet','blue','gray'];
  var SWATCH = {slate:'#6b8ba0',teal:'#2fb3b3',green:'#3fbf7f',amber:'#e0a63a',rose:'#e06a8a',violet:'#9a7be0',blue:'#4a9be0',gray:'#8a8f94'};
  var DEF = {jobs:{w:440,h:380,color:'green'},show:{w:440,h:380,color:'violet'},parked:{w:400,h:360,color:'amber'},notes:{w:360,h:280,color:'blue'},topics:{w:400,h:340,color:'teal'},activity:{w:400,h:340,color:'slate'},conversation:{w:420,h:380,color:'rose'}};
  var TITLES = {jobs:'Jobs',show:'Argo showed',parked:'Parked',notes:'Notes',topics:'Topics',activity:'Activity',conversation:'Conversation'};
  var canvas = document.getElementById('canvas'), chips = document.getElementById('chips'), msg = document.getElementById('msg');
  var project = (new URLSearchParams(location.search).get('project')) || localStorage.getItem('argoBoardProject') || 'All';
  var data = null, layout = {}, cards = {}, saveTimer = null, busy = false, seenFocus = null, seenTidy = null, showShown = '';

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function dur(m) { if (m < 1) return Math.max(1, Math.round(m * 60)) + 's'; if (m < 60) return Math.round(m) + 'm'; var h = Math.floor(m / 60); return h + 'h ' + Math.round(m - h * 60) + 'm'; }
  function ago(s) { return s < 90 ? s + 's' : s < 5400 ? Math.round(s / 60) + 'm' : Math.round(s / 3600) + 'h'; }

  // ---- layout ----------------------------------------------------------
  function colsFor() { var w = canvas.clientWidth || window.innerWidth; return Math.max(1, Math.floor((w - 16) / 456)); }
  function autoPlace(ids) {
    var n = colsFor(), heights = [], i;
    for (i = 0; i < n; i++) heights.push(16);
    ids.forEach(function (id) {
      if (layout[id] && layout[id].x != null && layout[id].y != null) return;
      var c = 0; for (i = 1; i < n; i++) if (heights[i] < heights[c]) c = i;
      var d = DEF[id], L = layout[id] = layout[id] || {};
      L.x = 16 + c * 456; L.y = heights[c]; L.w = L.w || d.w; L.h = L.h || d.h; L.color = L.color || d.color; L.z = L.z || 1;
      heights[c] += L.h + 16;
    });
  }
  function applyBox(id) {
    var c = cards[id], L = layout[id]; if (!c || !L) return;
    var s = c.el.style; s.left = L.x + 'px'; s.top = L.y + 'px'; s.width = L.w + 'px'; s.zIndex = L.z || 1;
    s.height = L.collapsed ? 'auto' : L.h + 'px';
    c.el.className = 'card c-' + (L.color || 'slate') + (L.collapsed ? ' collapsed' : '') + (c.el.classList.contains('pick') ? ' pick' : '');
    var bottom = 0; Object.keys(cards).forEach(function (k) { var l = layout[k]; if (l) bottom = Math.max(bottom, l.y + (l.collapsed ? 40 : l.h)); });
    canvas.style.height = Math.max(bottom + 60, window.innerHeight - 56) + 'px';
  }
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      fetch('/api/board/layout', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({project: project, layout: layout})}).catch(function () {});
    }, 500);
  }

  // ---- cards -------------------------------------------------------------
  function makeCard(id) {
    var card = el('div', 'card'), head = el('header'), body = el('div', 'body'), sw = el('div', 'swatches'), grip = el('div', 'grip');
    head.appendChild(el('b', '', TITLES[id]));
    var paint = el('button', '', '\u25cf'), fold = el('button', '', '\u2013');
    paint.title = 'Color'; fold.title = 'Collapse / expand';
    head.appendChild(paint); head.appendChild(fold);
    COLORS.forEach(function (c) { var s = el('div', 'sw'); s.style.background = SWATCH[c]; s.title = c;
      s.onclick = function () { layout[id].color = c; card.classList.remove('pick'); applyBox(id); save(); }; sw.appendChild(s); });
    paint.onclick = function () { card.classList.toggle('pick'); };
    fold.onclick = function () { layout[id].collapsed = !layout[id].collapsed; applyBox(id); save(); };
    card.appendChild(head); card.appendChild(sw); card.appendChild(body); card.appendChild(grip);
    // drag
    head.addEventListener('pointerdown', function (e) {
      if (e.target.tagName === 'BUTTON') return;
      var L = layout[id], sx = e.clientX, sy = e.clientY, ox = L.x, oy = L.y; busy = true;
      L.z = 1 + Math.max.apply(null, Object.keys(layout).map(function (k) { return layout[k].z || 1; })); applyBox(id);
      head.setPointerCapture(e.pointerId);
      function mv(ev) { L.x = Math.max(0, Math.round(ox + ev.clientX - sx)); L.y = Math.max(0, Math.round(oy + ev.clientY - sy)); applyBox(id); }
      function up() { head.removeEventListener('pointermove', mv); head.removeEventListener('pointerup', up); busy = false; save(); }
      head.addEventListener('pointermove', mv); head.addEventListener('pointerup', up);
    });
    // resize
    grip.addEventListener('pointerdown', function (e) {
      var L = layout[id], sx = e.clientX, sy = e.clientY, ow = L.w, oh = L.h; busy = true; e.stopPropagation();
      grip.setPointerCapture(e.pointerId);
      function mv(ev) { L.w = Math.max(220, Math.round(ow + ev.clientX - sx)); L.h = Math.max(120, Math.round(oh + ev.clientY - sy)); applyBox(id); }
      function up() { grip.removeEventListener('pointermove', mv); grip.removeEventListener('pointerup', up); busy = false; save(); }
      grip.addEventListener('pointermove', mv); grip.addEventListener('pointerup', up);
    });
    canvas.appendChild(card);
    return {el: card, body: body, sig: ''};
  }

  function renderJobs(body, jobs) {
    body.textContent = '';
    if (!jobs.length) { body.appendChild(el('div', 'dim', 'No jobs for this project.')); return; }
    jobs.forEach(function (j) {
      var r = el('div', 'row'), t = el('div', 't'), active = j.status === 'running' || j.status === 'starting';
      var st = j.state === 'stalled' ? 'stalled' : j.state === 'running' ? 'working' : j.status;
      t.appendChild(el('b', '', j.task || j.id)); t.appendChild(el('span', 'tag ' + st, st === 'waiting' ? 'needs you' : st === 'timed_out' ? 'timed out' : st));
      r.appendChild(t);
      var meta = (active ? 'running ' : j.status === 'done' ? 'took ' : '') + dur(j.minutes);
      if (active) meta += ' \u00b7 last activity ' + ago(j.quiet_seconds) + ' ago';
      if (j.percent != null) meta += ' \u00b7 ' + j.percent + '%';
      if (j.step && active) meta += ' \u00b7 ' + j.step;
      if (!data || data.project === 'All') meta = (j.project ? j.project + ' \u00b7 ' : '') + meta;
      r.appendChild(el('div', 'dim', meta));
      if (j.percent != null) { var b = el('div', 'bar'), f = el('i'); f.style.width = j.percent + '%'; b.appendChild(f); r.appendChild(b); }
      if (j.status === 'waiting' && j.question) r.appendChild(el('div', 'q', 'Question: ' + j.question));
      if (active || j.status === 'waiting') {
        var x = el('button', 'btn', 'Cancel'); x.style.marginTop = '6px';
        x.onclick = function () {
          if (!confirm('Cancel this job?')) return;
          fetch('/api/jobs/cancel', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: j.id})}).then(load);
        };
        r.appendChild(x);
      }
      if (j.state === 'stalled') r.appendChild(el('div', 'prev', 'No output for ' + ago(j.quiet_seconds) + '. Tell Argo "retry job ' + j.id.slice(-6) + '".'));
      if (j.status === 'failed' && j.error) r.appendChild(el('div', 'prev', j.error));
      if (j.status === 'done' && j.summary) r.appendChild(el('div', 'prev', j.summary.slice(0, 200)));
      body.appendChild(r);
    });
  }
  function renderParked(body, items) {
    body.textContent = '';
    items.forEach(function (it) {
      var r = el('div', 'row click'), t = el('div', 't');
      t.appendChild(el('b', '', it.title)); t.appendChild(el('span', 'tag ' + it.kind, it.kind)); r.appendChild(t);
      r.appendChild(el('div', 'dim', it.date + (it.project && project === 'All' ? ' \u00b7 ' + it.project : '') + (it.why ? ' \u00b7 ' + it.why : '')));
      var pv = el('div', 'prev', it.preview); pv.style.display = 'none'; r.appendChild(pv);
      r.onclick = function () { pv.style.display = pv.style.display === 'none' ? 'block' : 'none'; };
      body.appendChild(r);
    });
  }
  function renderNotes(body, notes) {
    body.textContent = '';
    notes.forEach(function (n) { body.appendChild(el('div', 'note', n)); });
  }
  function renderTopics(body, items) {
    body.textContent = '';
    var open = {};
    items.forEach(function (tp) {
      var key = tp.project + '/' + tp.topic, r = el('div', 'row click'), t = el('div', 't');
      t.appendChild(el('b', '', tp.topic)); t.appendChild(el('span', 'tag idea', tp.count + ''));
      r.appendChild(t);
      if (project === 'All') r.appendChild(el('div', 'dim', tp.project));
      var list = el('div', 'prev'); list.textContent = tp.entries.join('\n'); list.style.display = 'none'; r.appendChild(list);
      r.appendChild(el('div', 'dim', tp.entries[0] ? tp.entries[0].slice(0, 90) : ''));
      r.onclick = function () { list.style.display = list.style.display === 'none' ? 'block' : 'none'; };
      body.appendChild(r);
    });
  }
  function renderConversation(body, rows) {
    body.textContent = '';
    rows.forEach(function (c) {
      var r = el('div', 'row'), t = el('div', 't');
      t.appendChild(el('b', '', c.who === 'you' ? 'You' : 'Argo'));
      t.appendChild(el('span', 'dim', c.clock));
      r.appendChild(t); r.appendChild(el('div', 'prev', c.text));
      body.appendChild(r);
    });
  }
  function renderActivity(body, rows) {
    body.textContent = '';
    rows.forEach(function (a) {
      var r = el('div', 'note');
      r.appendChild(el('span', 'tag ' + (a.ok ? 'done' : 'failed'), a.ok ? 'ok' : 'failed'));
      r.appendChild(document.createTextNode(' ' + a.tool + ' '));
      r.appendChild(el('span', 'dim', a.clock.slice(11) + (a.said ? ' \u00b7 ' + a.said : '')));
      body.appendChild(r);
    });
  }
  function renderShow(body, items) {
    var last = items[items.length - 1]; if (!last || last.id === showShown) return;
    showShown = last.id;
    fetch('/api/show', {cache: 'no-store'}).then(function (r) { return r.json(); }).then(function (d) {
      var it = (d.items || []).filter(function (x) { return x.id === last.id; })[0]; if (!it) return;
      body.textContent = '';
      if (it.kind === 'image') { var im = el('img'); im.alt = it.title || ''; im.src = it.src; body.appendChild(im); }
      else { var fr = el('iframe'); fr.setAttribute('sandbox', ''); fr.srcdoc = it.html || ''; body.appendChild(fr); }
      if (it.caption) body.appendChild(el('div', 'dim', it.caption));
      if (cards.show) cards.show.el.querySelector('b').textContent = it.title || 'Argo showed';
    }).catch(function () {});
  }

  // ---- data ----------------------------------------------------------------
  function render() {
    var want = ['jobs'];
    if (data.show.length) want.push('show');
    if (data.parked.length) want.push('parked');
    if (data.notes.length) want.push('notes');
    if (data.topics.length) want.push('topics');
    if (data.activity.length) want.push('activity');
    if (data.conversation.length) want.push('conversation');
    Object.keys(cards).forEach(function (id) { if (want.indexOf(id) < 0) { cards[id].el.remove(); delete cards[id]; if (id === 'show') showShown = ''; } });
    want.forEach(function (id) { if (!cards[id]) cards[id] = makeCard(id); });
    autoPlace(want);
    want.forEach(function (id) {
      applyBox(id);
      var sig = JSON.stringify(data[id]);
      if (cards[id].sig === sig) return; cards[id].sig = sig;
      if (id === 'jobs') renderJobs(cards[id].body, data.jobs);
      else if (id === 'parked') renderParked(cards[id].body, data.parked);
      else if (id === 'notes') renderNotes(cards[id].body, data.notes);
      else if (id === 'topics') renderTopics(cards[id].body, data.topics);
      else if (id === 'activity') renderActivity(cards[id].body, data.activity);
      else if (id === 'conversation') renderConversation(cards[id].body, data.conversation);
      else renderShow(cards[id].body, data.show);
    });
    var live = data.jobs.filter(function (j) { return j.status === 'running' || j.status === 'starting'; }).length;
    var ask = data.jobs.filter(function (j) { return j.status === 'waiting'; }).length;
    msg.textContent = live + ' active' + (ask ? ', ' + ask + ' waiting on you' : '');
  }
  function drawChips() {
    chips.textContent = '';
    data.projects.forEach(function (p) {
      var c = el('button', 'chip' + (p === data.project ? ' on' : ''), p);
      c.onclick = function () { setProject(p); }; chips.appendChild(c); chips.appendChild(document.createTextNode(' '));
    });
  }
  function setProject(p) {
    project = p; localStorage.setItem('argoBoardProject', p); showShown = '';
    Object.keys(cards).forEach(function (id) { cards[id].el.remove(); }); cards = {}; layout = {}; load();
  }
  function load() {
    fetch('/api/board?project=' + encodeURIComponent(project), {cache: 'no-store'}).then(function (r) { return r.json(); }).then(function (d) {
      if (busy) return;
      var f = d.focus || {};
      if (seenFocus === null) { seenFocus = f.seq; seenTidy = f.tidy_seq; }
      if (f.seq !== seenFocus) { seenFocus = f.seq; if (f.project && f.project !== d.project) { setProject(f.project); return; } }
      if (f.tidy_seq !== seenTidy) { seenTidy = f.tidy_seq; layout = {}; Object.keys(cards).forEach(function (id) { cards[id].el.remove(); }); cards = {}; showShown = ''; }
      data = d; project = d.project;
      if (!Object.keys(layout).length && d.layout) layout = JSON.parse(JSON.stringify(d.layout));
      drawChips(); render();
    }).catch(function () { msg.textContent = 'offline'; });
  }
  document.getElementById('tidy').onclick = function () {
    layout = {}; Object.keys(cards).forEach(function (id) { cards[id].el.remove(); }); cards = {}; showShown = '';
    fetch('/api/board/layout', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({project: project, layout: {}})})
      .then(load).catch(load);
  };
  window.addEventListener('resize', function () { if (data) render(); });
  load(); setInterval(load, 4000);
})();
</script>
</body>
</html>
