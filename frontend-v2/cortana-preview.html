<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cortana · Local voice preview</title>
<style>
body{margin:0;background:#080d18;color:#dbeafa;font:16px system-ui;display:grid;place-items:center;min-height:100vh}
main{max-width:560px;padding:24px;text-align:center}
.avatar-stage{position:relative;width:min(460px,85vw);aspect-ratio:1;overflow:hidden;border:1px solid #17617d;border-radius:18px;margin:auto;background:#000}
img,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
canvas{opacity:0}.local-animated canvas{opacity:1}
button{padding:12px 18px;background:#0b9ed3;color:#fff;border:0;border-radius:8px;cursor:pointer;margin:8px}
p{color:#99b1c8;line-height:1.5}input{width:220px}a{color:#4dc8f5}
</style>
<main>
<h1>Cortana</h1>
<div class="avatar-stage"><img src="/v2-assets/cortana_portrait_smirky.png" alt="Cortana"><canvas id="portrait" aria-label="Animated Cortana portrait"></canvas></div>
<p id="status">Loading local renderer…</p>
<label>Mouth test <input id="mouth" type="range" min="0" max="1" step="0.01" value="0"></label><br>
<button id="sample">Play sample speech</button><button id="stop">Stop / close mouth</button>
<p>This is a local 2D portrait with voice-driven mouth and jaw motion. The sample is a saved clip for testing; live mode follows ARGO’s received voice.</p>
<a href="/v2">Back to Command Center</a>
<audio id="audio" src="/v2-assets/cortana_hedra_avatar_test.mp4" preload="none"></audio>
</main>
<script src="/v2-assets/cortana-avatar.js"></script>
<script>
const renderer=new CortanaAvatar.Portrait(document.getElementById('portrait'),'/v2-assets/cortana_portrait_smirky.png');
const envelope=new CortanaAvatar.Envelope();
const audio=document.getElementById('audio'),mouth=document.getElementById('mouth'),status=document.getElementById('status');
let context,analyser,data,last=0;
document.getElementById('sample').onclick=async()=>{
 try{
  if(!context){context=new AudioContext();const source=context.createMediaElementSource(audio);analyser=context.createAnalyser();analyser.fftSize=1024;source.connect(analyser);analyser.connect(context.destination);data=new Float32Array(analyser.fftSize);}
  await context.resume();audio.currentTime=0;await audio.play();
 }catch(e){status.textContent='Sample playback unavailable: '+e.message;}
};
document.getElementById('stop').onclick=()=>{audio.pause();mouth.value=0;};
mouth.oninput=()=>audio.pause();
function frame(now){
 requestAnimationFrame(frame);if(now-last<32)return;
 const dt=last?(now-last)/1000:0.033;last=now;
 let level=Number(mouth.value);
 if(analyser&&!audio.paused){analyser.getFloatTimeDomainData(data);let sum=0;for(const v of data)sum+=v*v;level=envelope.update(Math.sqrt(sum/data.length),dt);}
 renderer.draw(now,level,matchMedia('(prefers-reduced-motion: reduce)').matches);
 if(renderer.ready)status.textContent=audio.paused?'Local renderer ready · mouth test '+Math.round(level*100)+'%':'Sample speech · mouth follows audio';
}
requestAnimationFrame(frame);
</script>
</html>
