<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARGO Avatar Test</title>
<style>
:root {
  --bg: #050914;
  --panel: rgba(15, 23, 42, 0.64);
  --cyan: #0ea5e9;
  --amber: #f59e0b;
  --text: #e5eefc;
  --dim: #718096;
}
* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: Consolas, "Courier New", monospace;
}
body {
  background:
    radial-gradient(circle at 50% 42%, rgba(14,165,233,0.18), transparent 33%),
    radial-gradient(circle at 50% 72%, rgba(245,158,11,0.1), transparent 38%),
    linear-gradient(180deg, #050914, #02040b);
}
.stage {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
}
.avatar-shell {
  position: relative;
  width: min(72vh, 72vw, 760px);
  aspect-ratio: 1 / 1;
  border-radius: 28px;
  overflow: hidden;
  background: #020617;
  border: 1px solid rgba(14,165,233,0.32);
  box-shadow:
    0 0 90px rgba(14,165,233,0.2),
    inset 0 0 60px rgba(245,158,11,0.08);
}
.avatar-shell::before,
.avatar-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
}
.avatar-shell::before {
  background:
    linear-gradient(90deg, rgba(14,165,233,0.12), transparent 22%, transparent 78%, rgba(245,158,11,0.12)),
    radial-gradient(circle at 50% 35%, transparent 45%, rgba(2,6,23,0.32));
}
.avatar-shell::after {
  opacity: 0;
  background: linear-gradient(180deg, transparent 0%, rgba(14,165,233,0.16) 50%, transparent 100%);
  transform: translateY(-100%);
}
.avatar-shell.running::after {
  animation: scan 4.8s linear infinite;
}
.avatar {
  position: absolute;
  inset: -1.5%;
  width: 103%;
  height: 103%;
  object-fit: cover;
  object-position: center;
  transform-origin: 50% 62%;
  filter: brightness(1.02) saturate(1.06);
}
.avatar-shell.running .avatar {
  animation: idle 7.2s ease-in-out infinite;
}
.avatar-shell.talking .avatar {
  animation: talking 0.9s ease-in-out infinite;
}
.eye-glow {
  position: absolute;
  top: 42.2%;
  width: 8.2%;
  height: 4.2%;
  z-index: 4;
  opacity: 0;
  border-radius: 999px;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 45%, rgba(125,211,252,0.92), rgba(14,165,233,0.18) 42%, transparent 72%);
  box-shadow: 0 0 18px rgba(14,165,233,0.45);
  mix-blend-mode: screen;
  transform: translate(-50%, -50%) scaleX(0.75) scaleY(0.45);
}
.eye-left { left: 42.1%; }
.eye-right { left: 58.3%; }
.eyelid {
  position: absolute;
  top: 38.8%;
  width: 9.8%;
  height: 7.6%;
  z-index: 5;
  opacity: 0;
  border-radius: 999px;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(2,6,23,0.92), rgba(2,6,23,0.52));
  transform: translateX(-50%) scaleY(0);
  transform-origin: 50% 0%;
}
.eyelid-left { left: 42.1%; }
.eyelid-right { left: 58.3%; }
.avatar-shell.talking .eye-glow {
  animation: eyes 2.4s ease-in-out infinite;
}
.avatar-shell.talking .eyelid {
  animation: blink 4.8s ease-in-out infinite;
}
.mouth-glow {
  position: absolute;
  left: 50%;
  top: 60.8%;
  width: 16%;
  height: 2.5%;
  transform: translate(-50%, -50%) scaleX(0.78) scaleY(0.38);
  border-radius: 999px;
  opacity: 0;
  z-index: 4;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 50%, rgba(14,165,233,0.6), transparent 58%),
    linear-gradient(90deg, transparent, rgba(245,158,11,0.5), transparent);
  mix-blend-mode: screen;
  box-shadow: 0 0 18px rgba(14,165,233,0.32);
}
.avatar-shell.talking .mouth-glow {
  animation: mouth 0.22s ease-in-out infinite;
}
.jaw-glow {
  position: absolute;
  left: 50%;
  top: 66%;
  width: 22%;
  height: 12%;
  z-index: 3;
  opacity: 0;
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%) scaleY(0.7);
  background: radial-gradient(circle at 50% 0%, rgba(14,165,233,0.22), transparent 68%);
  mix-blend-mode: screen;
}
.cheek-glow {
  position: absolute;
  top: 53%;
  width: 15%;
  height: 8%;
  z-index: 3;
  opacity: 0;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle at 50% 50%, rgba(245,158,11,0.22), transparent 70%);
  mix-blend-mode: screen;
}
.cheek-left { left: 36%; }
.cheek-right { right: 34%; }
.avatar-shell.talking .jaw-glow {
  animation: jaw 0.22s ease-in-out infinite;
}
.avatar-shell.talking .cheek-glow {
  animation: cheeks 1.2s ease-in-out infinite;
}
.controls {
  position: fixed;
  left: 50%;
  bottom: 34px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 10;
  padding: 10px;
  border: 1px solid rgba(30,41,59,0.9);
  border-radius: 14px;
  background: var(--panel);
  box-shadow: 0 20px 80px rgba(0,0,0,0.35);
  backdrop-filter: blur(18px);
}
.btn {
  border: 1px solid rgba(14,165,233,0.32);
  border-radius: 10px;
  padding: 12px 18px;
  min-width: 94px;
  background: rgba(15,23,42,0.9);
  color: var(--text);
  font: 700 13px Consolas, "Courier New", monospace;
  cursor: pointer;
}
.btn.primary {
  background: linear-gradient(135deg, var(--cyan), #0284c7);
  border-color: var(--cyan);
  color: white;
  box-shadow: 0 0 24px rgba(14,165,233,0.3);
}
.btn.danger {
  border-color: rgba(239,68,68,0.48);
  color: #fecaca;
}
.status {
  position: fixed;
  left: 28px;
  top: 24px;
  z-index: 10;
  color: var(--dim);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.status span {
  color: var(--amber);
}
@keyframes idle {
  0%, 100% { transform: scale(1.018) translateY(0); }
  50% { transform: scale(1.045) translateY(-5px); }
}
@keyframes talking {
  0%, 100% { transform: scale(1.025) translateY(0) rotate(0deg); filter: brightness(1.04) saturate(1.08); }
  25% { transform: scale(1.047) translateY(-3px) rotate(-0.35deg); }
  50% { transform: scale(1.058) translateY(-4px) rotate(0.28deg); filter: brightness(1.12) saturate(1.18); }
  75% { transform: scale(1.041) translateY(-2px) rotate(-0.18deg); }
}
@keyframes eyes {
  0%, 100% {
    opacity: 0.25;
    transform: translate(-50%, -50%) scaleX(0.75) scaleY(0.45);
  }
  40% {
    opacity: 0.76;
    transform: translate(-50%, -50%) scaleX(1.06) scaleY(0.8);
  }
  58% {
    opacity: 0.48;
    transform: translate(-50%, -50%) scaleX(0.92) scaleY(0.58);
  }
}
@keyframes blink {
  0%, 86%, 94%, 100% {
    opacity: 0;
    transform: translateX(-50%) scaleY(0);
  }
  89%, 91% {
    opacity: 0.88;
    transform: translateX(-50%) scaleY(1);
  }
}
@keyframes mouth {
  0%, 100% {
    opacity: 0.32;
    transform: translate(-50%, -50%) scaleX(0.72) scaleY(0.3);
  }
  50% {
    opacity: 0.9;
    transform: translate(-50%, -50%) scaleX(1.22) scaleY(1.35);
  }
}
@keyframes jaw {
  0%, 100% {
    opacity: 0.08;
    transform: translate(-50%, -50%) scaleY(0.58);
  }
  50% {
    opacity: 0.42;
    transform: translate(-50%, -42%) scaleY(1.05);
  }
}
@keyframes cheeks {
  0%, 100% { opacity: 0.1; transform: scale(0.85); }
  50% { opacity: 0.42; transform: scale(1.08); }
}
@keyframes scan {
  0% { opacity: 0; transform: translateY(-100%); }
  12% { opacity: 0.8; }
  100% { opacity: 0; transform: translateY(100%); }
}
</style>
</head>
<body>
  <div class="status">Avatar Test / <span id="modeText">Idle</span></div>
  <main class="stage">
    <div class="avatar-shell" id="avatarShell">
      <img class="avatar" src="/v2-assets/cortana_portrait_smirky.png" alt="Cortana-style avatar test">
      <div class="eye-glow eye-left" aria-hidden="true"></div>
      <div class="eye-glow eye-right" aria-hidden="true"></div>
      <div class="eyelid eyelid-left" aria-hidden="true"></div>
      <div class="eyelid eyelid-right" aria-hidden="true"></div>
      <div class="mouth-glow" aria-hidden="true"></div>
      <div class="jaw-glow" aria-hidden="true"></div>
      <div class="cheek-glow cheek-left" aria-hidden="true"></div>
      <div class="cheek-glow cheek-right" aria-hidden="true"></div>
    </div>
  </main>
  <div class="controls">
    <button class="btn primary" id="startBtn">Start</button>
    <button class="btn danger" id="closeBtn">Close</button>
  </div>

<script>
const shell = document.getElementById('avatarShell');
const modeText = document.getElementById('modeText');
const startBtn = document.getElementById('startBtn');
const closeBtn = document.getElementById('closeBtn');

function setMode(mode) {
  shell.classList.toggle('running', mode !== 'idle');
  shell.classList.toggle('talking', mode === 'talking');
  modeText.textContent = mode === 'talking' ? 'Full Animation' : 'Idle';
  startBtn.textContent = mode === 'idle' ? 'Start' : 'Stop';
}

startBtn.addEventListener('click', () => {
  const running = shell.classList.contains('running');
  setMode(running ? 'idle' : 'talking');
});

closeBtn.addEventListener('click', () => {
  if (window.history.length > 1) window.history.back();
  else window.location.href = '/v2';
});

setMode('idle');
</script>
</body>
</html>
