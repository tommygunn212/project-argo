<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARGO Avatar Test</title>
<style>
:root {
  --bg: #050914;
  --panel: rgba(15, 23, 42, 0.64);
  --cyan: #0ea5e9;
  --amber: #f59e0b;
  --text: #e5eefc;
  --dim: #718096;
}
* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: Consolas, "Courier New", monospace;
}
body {
  background:
    radial-gradient(circle at 50% 42%, rgba(14,165,233,0.18), transparent 33%),
    radial-gradient(circle at 50% 72%, rgba(245,158,11,0.1), transparent 38%),
    linear-gradient(180deg, #050914, #02040b);
}
.stage {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
}
.avatar-shell {
  position: relative;
  width: min(72vh, 72vw, 760px);
  aspect-ratio: 1 / 1;
  border-radius: 28px;
  overflow: hidden;
  background: #020617;
  border: 1px solid rgba(14,165,233,0.32);
  box-shadow:
    0 0 90px rgba(14,165,233,0.2),
    inset 0 0 60px rgba(245,158,11,0.08);
}
.avatar-shell::before,
.avatar-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
}
.avatar-shell::before {
  background:
    linear-gradient(90deg, rgba(14,165,233,0.12), transparent 22%, transparent 78%, rgba(245,158,11,0.12)),
    radial-gradient(circle at 50% 35%, transparent 45%, rgba(2,6,23,0.32));
}
.avatar-shell::after {
  opacity: 0;
  background: linear-gradient(180deg, transparent 0%, rgba(14,165,233,0.16) 50%, transparent 100%);
  transform: translateY(-100%);
}
.avatar-shell.running::after {
  animation: scan 4.8s linear infinite;
}
.avatar {
  position: absolute;
  inset: -1.5%;
  width: 103%;
  height: 103%;
  object-fit: cover;
  object-position: center;
  transform-origin: 50% 62%;
  filter: brightness(1.02) saturate(1.06);
}
.avatar-shell.running .avatar {
  animation: idle 7.2s ease-in-out infinite;
}
.avatar-shell.talking .avatar {
  animation: talking 0.42s ease-in-out infinite;
}
.mouth-glow {
  position: absolute;
  left: 50%;
  top: 61%;
  width: 18%;
  height: 3.5%;
  transform: translate(-50%, -50%) scaleX(0.78) scaleY(0.38);
  border-radius: 999px;
  opacity: 0;
  z-index: 4;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 50%, rgba(14,165,233,0.6), transparent 58%),
    linear-gradient(90deg, transparent, rgba(245,158,11,0.5), transparent);
  mix-blend-mode: screen;
  box-shadow: 0 0 18px rgba(14,165,233,0.32);
}
.avatar-shell.talking .mouth-glow {
  animation: mouth 0.28s ease-in-out infinite;
}
.controls {
  position: fixed;
  left: 50%;
  bottom: 34px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 10;
  padding: 10px;
  border: 1px solid rgba(30,41,59,0.9);
  border-radius: 14px;
  background: var(--panel);
  box-shadow: 0 20px 80px rgba(0,0,0,0.35);
  backdrop-filter: blur(18px);
}
.btn {
  border: 1px solid rgba(14,165,233,0.32);
  border-radius: 10px;
  padding: 12px 18px;
  min-width: 94px;
  background: rgba(15,23,42,0.9);
  color: var(--text);
  font: 700 13px Consolas, "Courier New", monospace;
  cursor: pointer;
}
.btn.primary {
  background: linear-gradient(135deg, var(--cyan), #0284c7);
  border-color: var(--cyan);
  color: white;
  box-shadow: 0 0 24px rgba(14,165,233,0.3);
}
.btn.danger {
  border-color: rgba(239,68,68,0.48);
  color: #fecaca;
}
.status {
  position: fixed;
  left: 28px;
  top: 24px;
  z-index: 10;
  color: var(--dim);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.status span {
  color: var(--amber);
}
@keyframes idle {
  0%, 100% { transform: scale(1.018) translateY(0); }
  50% { transform: scale(1.045) translateY(-5px); }
}
@keyframes talking {
  0%, 100% { transform: scale(1.025) translateY(0); filter: brightness(1.04) saturate(1.08); }
  50% { transform: scale(1.058) translateY(-3px); filter: brightness(1.12) saturate(1.18); }
}
@keyframes mouth {
  0%, 100% {
    opacity: 0.28;
    transform: translate(-50%, -50%) scaleX(0.78) scaleY(0.38);
  }
  50% {
    opacity: 0.78;
    transform: translate(-50%, -50%) scaleX(1.12) scaleY(1.12);
  }
}
@keyframes scan {
  0% { opacity: 0; transform: translateY(-100%); }
  12% { opacity: 0.8; }
  100% { opacity: 0; transform: translateY(100%); }
}
</style>
</head>
<body>
  <div class="status">Avatar Test / <span id="modeText">Idle</span></div>
  <main class="stage">
    <div class="avatar-shell" id="avatarShell">
      <img class="avatar" src="/v2-assets/argo-hedra-default.png" alt="ARGO avatar test">
      <div class="mouth-glow" aria-hidden="true"></div>
    </div>
  </main>
  <div class="controls">
    <button class="btn primary" id="startBtn">Start</button>
    <button class="btn danger" id="closeBtn">Close</button>
  </div>

<script>
const shell = document.getElementById('avatarShell');
const modeText = document.getElementById('modeText');
const startBtn = document.getElementById('startBtn');
const closeBtn = document.getElementById('closeBtn');

function setMode(mode) {
  shell.classList.toggle('running', mode !== 'idle');
  shell.classList.toggle('talking', mode === 'talking');
  modeText.textContent = mode === 'talking' ? 'Full Animation' : 'Idle';
  startBtn.textContent = mode === 'idle' ? 'Start' : 'Stop';
}

startBtn.addEventListener('click', () => {
  const running = shell.classList.contains('running');
  setMode(running ? 'idle' : 'talking');
});

closeBtn.addEventListener('click', () => {
  if (window.history.length > 1) window.history.back();
  else window.location.href = '/v2';
});

setMode('idle');
</script>
</body>
</html>
